version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: tgsm
    flags:
      - -trimpath
      - -buildmode=pie
    gcflags:
      - -l
      - -B
      - -C
    ldflags:
      - -s -w
      - -extldflags=-static
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    hooks:
      pre:
        - go run tools/generate_defaults.go

# UPX compression configuration
upx:
  - enabled: true
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

nfpms:
  - id: default
    package_name: tgsm
    vendor: "Sahithyan K."
    homepage: https://github.com/sahithyandev/tg-system-monitor
    maintainer: "Sahithyan K. <sahithyan2701@gmail.com>"
    description: A lightweight Telegram-based system monitor for Linux servers.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    file_name_template: "tgsm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: tgsm.service
        dst: /usr/lib/systemd/system/tgsm.service
        file_info:
          mode: 0644
      - src: default-config.yml
        dst: /usr/share/tgsm/config.yml.example
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/preinstall.sh
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

