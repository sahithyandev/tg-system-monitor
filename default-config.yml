# Copy this file to ~/.config/tg-system-monitor/config.yml

# Optional: Get from @BotFather on Telegram.
# If omitted, the monitor runs in collector-only mode (no Telegram bot or alerts).
bot_token: ""

# Optional: Expose the latest metrics as JSON over HTTP for other services to query.
# Empty = disabled. When set, prefer binding to localhost, e.g. "127.0.0.1:9090".
metrics_api_addr: ""

# Optional: Hash of password for users to join the bot
# DO NOT EDIT MANUALLY. USE `set-password` TO DO SO.
join_password_hash: ""

# Optional: Override hostname detection
hostname_override: ""

# Optional: How often to poll for system metrics (seconds)
poll_interval_seconds: 15

# Alert settings
alert_cooldown_seconds: 1800
top_process_count: 5

# Database path
db_path: "~/.config/tg-system-monitor/tgsm.db"

# Data retention
data_retention_days: 30

# Detection hysteresis to prevent flapping (percent)
hysteresis: 5.0

# How long a threshold must be continuously exceeded before an alert fires (seconds)
sustain_seconds: 300

# Per-metric monitoring thresholds.
# threshold_percent triggers a critical alert; recovery_percent marks recovery.
monitors:
  cpu:
    threshold_percent: 85.0
    recovery_percent: 70.0

  memory:
    threshold_percent: 90.0
    recovery_percent: 80.0

  swap:
    threshold_percent: 25.0
    recovery_percent: 10.0

  disk:
    threshold_percent: 95.0
    recovery_percent: 90.0
    # Additional data volumes to monitor (mounted data disks, databases, etc).
    # Each volume is shown in /status and raises Telegram alerts when above threshold.
    # threshold_percent and recovery_percent default to monitors.disk values if omitted.
    # volumes:
    #   - path: /data
    #     threshold_percent: 95.0
    #     recovery_percent: 90.0

  load:
    load1:
      warning: 2.0
      critical: 4.0
    load5:
      warning: 1.5
      critical: 3.0
    load15:
      warning: 1.0
      critical: 2.0

